name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Arm64-v8a Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lavender-photos-debug-arm64-v8a
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk

      - name: Upload Armeabi-v7a Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lavender-photos-debug-armeabi-v7a
          path: app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
